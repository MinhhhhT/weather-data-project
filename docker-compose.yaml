services: 
  db:
    container_name: postgres_container
    image: postgres:17.6
    ports: 
      - 5000:5432
    environment: 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: 
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
      - my-network

  af: 
    container_name: airflow_container
    image: apache/airflow:3.1.0
    user: "1000"
    group_add: 
      - '1001'
    ports: 
      - 8000:8080
    env_file: 
      - .env
    environment: 
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./api-request:/opt/airflow/api-request
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks: 
      - my-network
    command: >
      bash -c "airflow db migrate && airflow standalone"
      
  dbt: 
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    volumes: 
      - ./dbt/my_project:/usr/app
      - ./dbt:/root/.dbt
    working_dir: /usr/app
    environment: 
      DBT_PROFILES_DIR: "/root/.dbt"
    depends_on: 
      - db
    networks: 
      - my-network
    command: run

networks: 
  my-network:
    driver: bridge  